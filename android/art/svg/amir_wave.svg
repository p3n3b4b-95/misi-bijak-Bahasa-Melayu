    <path d="M440,690 L560,690 L566,790 C540,806 460,806 434,790 Z" fill="#E8A478"/>
    <path d="M440,700 C470,740 530,740 560,700" fill="none" stroke="#C98A62" stroke-width="6" opacity="0.5"/>

