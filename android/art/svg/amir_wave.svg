    <path d="M300,880 C330,830 380,800 440,790" fill="none" stroke="#FFF0A8" stroke-width="12" opacity="0.7"/>
    <path d="M436,770 L500,850 L564,770 Z" fill="#2C6AD0"/>
    <path d="M395,775 C420,830 450,860 500,880 C550,860 580,830 605,775" fill="none" stroke="#1D4FA8" stroke-width="5" opacity="0.5"/>
    <!-- straps -->
    <path d="M372,778 C360,880 350,1050 348,1250 L408,1250 C412,1080 420,900 430,790 Z" fill="url(#strap)"/>
    <path d="M628,778 C640,880 650,1050 652,1250 L592,1250 C588,1080 580,900 570,790 Z" fill="url(#strap)"/>
    <rect x="360" y="1010" width="46" height="34" rx="8" fill="#FFC53A"/>
    <rect x="594" y="1010" width="46" height="34" rx="8" fill="#FFC53A"/>

