    <ellipse cx="262" cy="500" rx="34" ry="46" fill="url(#skin)"/>
    <ellipse cx="738" cy="500" rx="34" ry="46" fill="url(#skin)"/>
    <path d="M254,478 C270,490 270,520 254,530" fill="none" stroke="#D9946A" stroke-width="7"/>
    <path d="M746,478 C730,490 730,520 746,530" fill="none" stroke="#D9946A" stroke-width="7"/>

