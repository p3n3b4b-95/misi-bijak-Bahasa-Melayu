    <path d="M268,486 C268,330 374,282 500,280 C626,282 732,330 732,478 C722,446 704,424 678,424 C660,444 636,448 612,432 C590,448 560,444 540,426 C520,448 480,448 460,426 C440,444 410,448 388,432 C364,448 340,444 324,424 C298,424 280,446 268,478 Z" fill="url(#hair)"/>
    <!-- cap -->
    <path d="M254,420 C254,282 368,196 500,196 C634,196 750,282 750,420 C706,392 612,376 500,376 C388,376 298,392 254,420 Z" fill="url(#cap)"/>
    <path d="M500,200 C466,262 456,332 470,390" fill="none" stroke="#14141A" stroke-width="5" opacity="0.7"/>
    <path d="M500,200 C534,262 546,332 534,390" fill="none" stroke="#14141A" stroke-width="5" opacity="0.7"/>
    <path d="M376,228 C396,290 402,344 396,394" fill="none" stroke="#14141A" stroke-width="5" opacity="0.55"/>
    <path d="M628,228 C608,290 602,344 606,394" fill="none" stroke="#14141A" stroke-width="5" opacity="0.55"/>
    <path d="M330,300 C350,262 392,236 440,222" fill="none" stroke="#8C8D99" stroke-width="12" opacity="0.55"/>
    <circle cx="500" cy="200" r="17" fill="#5A5B66"/>
    <path d="M520,384 C620,372 748,376 806,434 C796,454 748,458 694,446 C640,434 580,418 520,412 Z" fill="#26272F"/>
    <path d="M580,392 C660,386 740,392 780,424" fill="none" stroke="#6D6E7B" stroke-width="8" opacity="0.7"/>

    <!-- face -->
    <path d="M362,482 C386,458 430,456 456,472" fill="none" stroke="#2A1B14" stroke-width="13"/>
    <path d="M544,472 C570,456 614,458 638,482" fill="none" stroke="#2A1B14" stroke-width="13"/>
    <ellipse cx="412" cy="532" rx="47" ry="58" fill="#1A1313" stroke="none"/>
    <ellipse cx="588" cy="532" rx="47" ry="58" fill="#1A1313" stroke="none"/>
    <path d="M366,520 C380,478 444,476 458,520" fill="none" stroke="#1A1313" stroke-width="9"/>
    <path d="M542,520 C556,476 620,478 634,520" fill="none" stroke="#1A1313" stroke-width="9"/>
    <circle cx="395" cy="508" r="16" fill="#fff" stroke="none"/><circle cx="433" cy="556" r="8" fill="#fff" stroke="none" opacity="0.9"/>
    <circle cx="571" cy="508" r="16" fill="#fff" stroke="none"/><circle cx="609" cy="556" r="8" fill="#fff" stroke="none" opacity="0.9"/>
    <ellipse cx="338" cy="604" rx="44" ry="28" fill="#F47F7B" opacity="0.5" stroke="none"/>
    <ellipse cx="662" cy="604" rx="44" ry="28" fill="#F47F7B" opacity="0.5" stroke="none"/>
    <path d="M488,584 C496,596 506,596 514,584" fill="none" stroke="#C98A62" stroke-width="7"/>
    <path d="M425,628 C450,646 550,646 575,628 C575,692 540,722 500,722 C460,722 425,692 425,628 Z" fill="#A32135"/>
    <g clip-path="url(#mouthClip)" stroke="none">
      <ellipse cx="500" cy="706" rx="52" ry="30" fill="#F26D7D"/>
      <path d="M425,628 C450,646 550,646 575,628 L575,664 C540,672 460,672 425,664 Z" fill="#fff"/>
    </g>
    <path d="M425,628 C450,646 550,646 575,628 C575,692 540,722 500,722 C460,722 425,692 425,628 Z" fill="none"/>
  </g>
</svg>
