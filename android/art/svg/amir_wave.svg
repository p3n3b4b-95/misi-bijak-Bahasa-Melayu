    <path d="M672,858 L760,872" fill="none" stroke="#4B2A1B" stroke-width="108"/>
    <path d="M672,858 L760,872" fill="none" stroke="url(#shirt)" stroke-width="94"/>
    <path d="M730,868 L760,872" fill="none" stroke="#1F4FA3" stroke-width="98"/>
    <path d="M770,874 L850,812" fill="none" stroke="#4B2A1B" stroke-width="80"/>
    <path d="M770,874 L850,812" fill="none" stroke="url(#skinArm)" stroke-width="68"/>
    <g fill="none" stroke-linecap="round">
      <path d="M884,786 L960,742" stroke="#4B2A1B" stroke-width="44"/><path d="M884,786 L960,742" stroke="url(#skinArm)" stroke-width="32"/>
      <path d="M870,840 L900,846" stroke="#4B2A1B" stroke-width="40"/><path d="M870,840 L900,846" stroke="url(#skinArm)" stroke-width="28"/>
    </g>
    <ellipse cx="866" cy="806" rx="52" ry="44" transform="rotate(-25 866 806)" fill="url(#skinArm)"/>
    <path d="M846,820 C862,834 890,836 906,824" fill="none" stroke="#D9946A" stroke-width="5" opacity="0.7"/>

