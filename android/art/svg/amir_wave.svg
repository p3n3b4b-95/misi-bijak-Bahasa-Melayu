      <g fill="none" stroke-linecap="round">
        <path d="M82,560 L58,486" stroke="#4B2A1B" stroke-width="50"/><path d="M82,560 L58,486" stroke="url(#skinArm)" stroke-width="38"/>
        <path d="M122,540 L112,444" stroke="#4B2A1B" stroke-width="50"/><path d="M122,540 L112,444" stroke="url(#skinArm)" stroke-width="38"/>
        <path d="M164,544 L176,452" stroke="#4B2A1B" stroke-width="50"/><path d="M164,544 L176,452" stroke="url(#skinArm)" stroke-width="38"/>
        <path d="M200,566 L232,492" stroke="#4B2A1B" stroke-width="50"/><path d="M200,566 L232,492" stroke="url(#skinArm)" stroke-width="38"/>
        <path d="M206,636 L262,612" stroke="#4B2A1B" stroke-width="52"/><path d="M206,636 L262,612" stroke="url(#skinArm)" stroke-width="40"/>
      </g>
      <rect x="62" y="540" width="164" height="150" rx="70" fill="url(#skinArm)"/>
      <path d="M92,640 C120,664 168,664 196,640" fill="none" stroke="#D9946A" stroke-width="6" opacity="0.7"/>
