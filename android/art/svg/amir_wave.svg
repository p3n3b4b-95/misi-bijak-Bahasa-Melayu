<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 150 1000 1100">
  <!-- Amir: original character illustration for Misi Bijak. Hand-authored SVG, no third-party art. -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9B5"/><stop offset="0.6" stop-color="#F8C196"/><stop offset="1" stop-color="#EDA97D"/>
    </linearGradient>
    <linearGradient id="skinArm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD3AB"/><stop offset="1" stop-color="#EBA87C"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54A"/><stop offset="1" stop-color="#F6A623"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F73D8"/><stop offset="1" stop-color="#1D4FA8"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9F3D"/><stop offset="1" stop-color="#E4741A"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A4B55"/><stop offset="0.55" stop-color="#2F3038"/><stop offset="1" stop-color="#202128"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2626"/><stop offset="1" stop-color="#121010"/>
    </linearGradient>
    <clipPath id="mouthClip"><path d="M425,628 C450,646 550,646 575,628 C575,692 540,722 500,722 C460,722 425,692 425,628 Z"/></clipPath>
  </defs>
  <g stroke="#4B2A1B" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

