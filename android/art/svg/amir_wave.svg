    <path d="M250,880 C236,830 250,780 290,772 L336,778 L344,1250 L270,1250 C246,1130 240,990 250,880 Z" fill="url(#bag)"/>
    <path d="M266,930 C262,1010 268,1110 284,1190" fill="none" stroke="#C45E10" stroke-width="9" opacity="0.6"/>
    <path d="M262,826 C272,806 290,798 312,800" fill="none" stroke="#FFC987" stroke-width="11" opacity="0.8"/>

    <!-- raised left arm (viewer's left): sleeve + forearm + open waving hand -->
    <path d="M336,856 L236,806" fill="none" stroke="#4B2A1B" stroke-width="112"/>
    <path d="M336,856 L236,806" fill="none" stroke="url(#shirt)" stroke-width="98"/>
    <path d="M286,832 L250,814" fill="none" stroke="#1F4FA3" stroke-width="104"/>
    <path d="M238,800 L146,662" fill="none" stroke="#4B2A1B" stroke-width="84"/>
    <path d="M238,800 L146,662" fill="none" stroke="url(#skinArm)" stroke-width="72"/>
    <g id="waveHand">
